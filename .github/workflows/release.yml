name: Release LaunchLite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross (for ARM64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p cli
          else
            cargo build --release --target ${{ matrix.target }} -p cli
          fi

      - name: Package artifacts
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/launchlite"
          ARCHIVE_NAME="launchlite-${{ matrix.target }}.tar.gz"

          # Create tar.gz archive
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" launchlite

          # Generate SHA256 checksum
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

          # Direct binary copy
          cp "$BIN_PATH" "launchlite-${{ matrix.target }}"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            launchlite-${{ matrix.target }}.tar.gz
            launchlite-${{ matrix.target }}.tar.gz.sha256
            launchlite-${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
