[workspace]
resolver = "2"
members = [
    "packages/common",
    "packages/db",
    "packages/builder",
    "services/auth",
    "services/runtime",
    "services/web",
    "apps/api",
    "apps/cli",
]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["rabin18glan"]

[workspace.dependencies]
# Internal workspace crates
common = { path = "packages/common" }
db = { path = "packages/db" }
builder = { path = "packages/builder" }
auth = { path = "services/auth" }
runtime = { path = "services/runtime" }
web = { path = "services/web" }
api = { path = "apps/api" }

# Common external dependencies
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "fs", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-template = { version = "3.0", features = ["minijinja"] }
minijinja = { version = "2.7", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
