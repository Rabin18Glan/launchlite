<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Orange Shading Gradient -->
    <linearGradient id="darkOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Deep Contrast Shadow -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Background Base (Clean Black Canvas) -->
  <rect width="500" height="500" rx="100" fill="#09090B" />

  <!-- Logo Mark Group -->
  <g id="launchlite-icon" transform="translate(250, 250) rotate(-45) translate(-250, -250)">
    
    <!-- Outer Rocket Silhouette (White Sharp Contrast Border) -->
    <path d="M 250 50 
             C 285 110, 315 190, 315 310 
             L 370 360 
             L 300 360 
             L 285 410 
             L 215 410 
             L 200 360 
             L 130 360 
             L 185 310 
             C 185 190, 215 110, 250 50 Z" fill="#FFFFFF" />

    <!-- Left Wing (Dark Orange) -->
    <path d="M 194 316 L 148 350 L 198 350 Z" fill="#9A3412" />

    <!-- Right Wing (Dark Orange) -->
    <path d="M 306 316 L 352 350 L 302 350 Z" fill="url(#darkOrangeGrad)" />

    <!-- Left Half Body (Deep Black) -->
    <path d="M 250 64 
             C 220 120, 194 195, 194 308 
             L 204 350 
             L 250 350 Z" fill="url(#shadowGrad)" />

    <!-- Right Half Body (Dark Burnt Orange) -->
    <path d="M 250 64 
             C 280 120, 306 195, 306 308 
             L 296 350 
             L 250 350 Z" fill="url(#darkOrangeGrad)" />

    <!-- Center Lightning Cutout (Lite Symbol - White) -->
    <polygon points="256,120 226,220 252,220 240,296 274,196 248,196" fill="#FFFFFF" />

    <!-- Exhaust Engine Plinth (Black) -->
    <polygon points="220,360 280,360 270,394 230,394" fill="#09090B" />

    <!-- Minimal Jet Flame Thrust (Dark Orange + White Tip) -->
    <path d="M 234 402 L 266 402 L 250 450 Z" fill="#EA580C" />
    <path d="M 242 402 L 258 402 L 250 428 Z" fill="#FFFFFF" />
  </g>
</svg>
